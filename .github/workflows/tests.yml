name: Tests

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    # The suite is a few seconds of Vale runs; the ceiling is a generous multiple
    # of the install and sync, so a hang cannot hold a runner.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      # The style tests drive a real Vale binary through valedate and provide no
      # stub, so one must be on PATH. Pin the release and verify its checksum, so
      # a moved or replaced download fails the job instead of changing the tests.
      - name: Install Vale
        env:
          VALE_VERSION: '3.24.0'
          VALE_SHA256: '867534ddb678abca7f214bc4706ead0922bd5252ffe8035fc227013f66c8b214'
        run: |
          vale_dir="${RUNNER_TEMP}/vale"
          archive="${vale_dir}/vale.tar.gz"
          mkdir -p "${vale_dir}"
          curl -fsSL -o "${archive}" \
            "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          echo "${VALE_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" -C "${vale_dir}" vale
          echo "${vale_dir}" >> "${GITHUB_PATH}"

      - name: Run the tests
        run: make test
